
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>少林内劲一指禅 | 联系我们</title>
  <meta name="description" content="德国总部/北美联系方式" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="article-reference.css">


    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 40px 20px; }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 40px; }
        .shop-grid { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .item-card { background: white; border: 1px solid #e1e8ed; padding: 25px; border-radius: 12px; width: 260px; box-shadow: 0 6px 12px rgba(0,0,0,0.05); text-align: center; }
        .item-card img { max-width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
        .price-tag { font-size: 1.4rem; color: #27ae60; font-weight: bold; margin: 15px 0; }
        
        /* Buttons */
        .cart-btn { background-color: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .add-btn { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold; }
        .add-btn:hover { background-color: #0056b3; }
        .demo-btn { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; font-weight: bold; text-decoration: none; display: block; box-sizing: border-box;}
    </style>

    <!-- 1. Load Snipcart CSS Styles -->
    <link rel="stylesheet" href="https://snipcart.com" />

</head>
<body>  
          <!-- 1. THE PLACEHOLDER: Common-Header-placeholder -->
          <div id="Common-Header-placeholder"></div>


  <section class="hero-banner contactus-banner">
    <img class="hero-stamp"
         src="images/yzc-stamp.gif"
         alt="">
  </section>

  <main>


    <h1>Our Sale Items</h1>

    
        <!-- 2. The Global View Cart Button -->
        <button class="snipcart-checkout cart-btn">🛒 View Cart (<span class="snipcart-items-count">0</span>)</button>
    </div>

    <div class="shop-grid">
        
        <!-- PAID ITEM 1 -->
        <div class="item-card">

            <div class="price-tag">$10.00</div>

            <button class="snipcart-add-item add-btn"

              data-item-name="Photography E-Book"
              data-item-price="10.00"
              data-item-url="/mysaleitems.html"
              data-item-description="Master manual mode settings in 30 days.">

              data-item-id="lightroom-presets-02"
              data-item-name="Lightroom Filter Pack"
              data-item-price="15.00"
              data-item-url="/mysaleitems.html"
              data-item-description="15 cinematic presets for stunning edits.">
              Add to Cart
            </button>
        </div>

        <!-- FREE INSTANT DEMO ITEM -->
        <div class="item-card" style="border: 1px dashed #3498db;">
            <img src="https://placeholder.com" alt="Demo">
            <h3>Free Demo Guide</h3>
            <div class="price-tag" style="color: #3498db;">$0.00</div>
            
            <!-- Standard link bypasses the shopping cart for direct downloads -->
            <a href="demos/sample-guide.pdf" download class="demo-btn">Download Instantly</a>
        </div>

    </div>

    <!-- 3. Required Snipcart System Setup -->
    <div id="snipcart" data-api-key="NWM5ZGUzYmQtY2RkOS00MWYzLTg3NTktZjQzYzRhNDNhMmFlNjM5MjQyNDU4ODU3MTcxOTkx" hidden></div>
    <script async src="https://snipcart.com"></script>


  </main>

   
          <!-- 2. THE PLACEHOLDER: Common-Footer-placeholder -->
          <div id="Common-Footer-placeholder"></div>



  <script src="js/main.js"></script>

</html>
